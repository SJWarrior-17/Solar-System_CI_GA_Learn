name: Solar System Workflow

on:
    workflow_dispatch:
    push:
        branches:
            - main
            - 'feature/*'
env:
    MONGO_URI: 'mongodb+srv://solarsystem.z2qbxqp.mongodb.net/'
    MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
    MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

jobs:
    unit-testing:
        name: Unit Testing
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v6
              #Ref: https://github.com/marketplace/actions/checkout

            - name: Setup NodeJS version - 18
              uses: actions/setup-node@v4
              with:
                node-version: 18
              # Ref: https://github.com/marketplace/actions/setup-node-js-environment

            - name: Intalling Dependencies
              run: npm install
            
            - name: Nodejs-version
              run: node -v
                
            - name: NVM-Install
              run: |
                curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
                source ~/.bashrc
                nvm --version

            - name: Unit Testing
              run: npm test

            - name: Archive test result
              uses: actions/upload-artifact@v7
              with:
                name: Mocha-Test-Result
                path: test-result.xml
              #Ref: https://github.com/marketplace/actions/upload-a-build-artifact
